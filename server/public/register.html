<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản - eOffice DUT</title>
  <meta name="description" content="Trang đăng ký tài khoản eOffice DUT">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-glow: rgba(37, 99, 235, 0.1);
      --bg-color: #fafafa;
      --card-bg: #ffffff;
      --card-border: #e5e7eb;
      --text-main: #111827;
      --text-secondary: #4b5563;
      --text-muted: #9ca3af;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --error-color: #ef4444;
      --error-bg: #fef2f2;
      --error-border: #fca5a5;
      --success-color: #22c55e;
      --success-bg: #f0fdf4;
      --success-border: #86efac;
      --radius-lg: 16px;
      --radius-md: 12px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 32px 16px;
    }

    /* Container Card (Fluent Light Card) */
    .register-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      width: 100%;
      max-width: 480px;
      padding: 40px 36px;
      border-radius: var(--radius-lg);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.02);
      animation: card-appear 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes card-appear {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .logo-icon-container {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(37, 99, 235, 0.05);
      width: 56px;
      height: 56px;
      border-radius: 14px;
      color: var(--primary);
    }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .header-desc {
      text-align: center;
      margin-bottom: 28px;
    }

    .header-desc h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .header-desc p {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* Message Alerts */
    .alert {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: alert-slide-down 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid transparent;
      line-height: 1.4;
    }

    .alert-error {
      background: var(--error-bg);
      color: var(--error-color);
      border-color: var(--error-border);
    }

    .alert-success {
      background: var(--success-bg);
      color: var(--success-color);
      border-color: var(--success-border);
    }

    .alert-hidden {
      display: none !important;
    }

    @keyframes alert-slide-down {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Form Fields Grid */
    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 24px;
    }

    /* Form Inputs */
    .form-group {
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      padding: 12px 14px 12px 42px;
      font-size: 14.5px;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      transition: var(--transition);
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .form-input:focus + .input-icon {
      color: var(--primary);
    }

    /* Button */
    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.1);
      transition: var(--transition);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    /* Loader Spinner */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s infinite linear;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Footer Links */
    .form-footer {
      text-align: center;
      margin-top: 28px;
      font-size: 14px;
      color: var(--text-secondary);
      border-top: 1px solid var(--card-border);
      padding-top: 20px;
    }

    .login-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
    }

    .login-link:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Form Card -->
  <div class="register-container">
    <div class="brand-logo">
      <div class="logo-icon-container">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="brand-name">eOffice DUT</div>
    </div>

    <div class="header-desc">
      <h1>Đăng ký tài khoản</h1>
      <p>Tạo tài khoản để làm việc cùng trợ lý ảo eOffice AI</p>
    </div>

    <!-- Alert Messages -->
    <div id="alertBox" class="alert alert-hidden">
      <span id="alertIcon">⚠️</span>
      <span id="alertMessage">Lỗi đăng ký</span>
    </div>

    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-grid">
        <!-- Full Name -->
        <div class="form-group">
          <label for="nameInput" class="form-label">Họ và Tên</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="nameInput" 
              class="form-input" 
              placeholder="Nguyễn Văn A" 
              required 
              autocomplete="name"
            >
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="emailInput" class="form-label">Email cơ quan</label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="emailInput" 
              class="form-input" 
              placeholder="username@dut.udn.vn" 
              required 
              autocomplete="email"
            >
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="passwordInput" class="form-label">Mật khẩu</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="passwordInput" 
              class="form-input" 
              placeholder="Tối thiểu 6 ký tự..." 
              required 
              minlength="6"
              autocomplete="new-password"
            >
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirmPasswordInput" class="form-label">Xác nhận mật khẩu</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="confirmPasswordInput" 
              class="form-input" 
              placeholder="Nhập lại mật khẩu..." 
              required 
              autocomplete="new-password"
            >
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
              </svg>
            </span>
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="submit-btn">
        <span>Tạo tài khoản</span>
        <div id="btnSpinner" class="spinner"></div>
      </button>
    </form>

    <div class="form-footer">
      Bạn đã có tài khoản? <a href="/login.html" class="login-link">Đăng nhập tại đây</a>
    </div>
  </div>

  <script>
    const alertBox = document.getElementById('alertBox');
    const alertMessage = document.getElementById('alertMessage');
    const alertIcon = document.getElementById('alertIcon');
    const submitBtn = document.getElementById('submitBtn');
    const btnSpinner = document.getElementById('btnSpinner');

    function showAlert(type, message) {
      alertBox.className = `alert alert-${type}`;
      alertMessage.textContent = message;
      alertIcon.textContent = type === 'success' ? '✓' : '⚠️';
    }

    function hideAlert() {
      alertBox.classList.add('alert-hidden');
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideAlert();

      const fullName = document.getElementById('nameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const confirmPassword = document.getElementById('confirmPasswordInput').value;

      // Basic front-end checks
      if (password !== confirmPassword) {
        showAlert('error', 'Mật khẩu xác nhận không khớp.');
        return;
      }

      if (password.length < 6) {
        showAlert('error', 'Mật khẩu phải có ít nhất 6 ký tự.');
        return;
      }

      // Visual loading state
      submitBtn.disabled = true;
      btnSpinner.style.display = 'block';

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            fullName,
            email,
            password,
            confirmPassword
          })
        });

        const resData = await response.json();

        if (!response.ok) {
          throw new Error(resData.message || 'Đăng ký thất bại. Email có thể đã được sử dụng.');
        }

        showAlert('success', 'Đăng ký tài khoản thành công! Đang chuyển đến trang đăng nhập...');
        
        // Wait then redirect to login page
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1800);

      } catch (error) {
        console.error('Registration error:', error);
        showAlert('error', error.message);
        submitBtn.disabled = false;
        btnSpinner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
