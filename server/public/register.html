<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản - eOffice DUT</title>
  <meta name="description" content="Trang đăng ký tài khoản eOffice DUT">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0078d4;
      --primary-hover: #005a9e;
      --primary-glow: rgba(0, 120, 212, 0.3);
      --bg-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #ffffff;
      --text-muted: #b0c4de;
      --input-bg: rgba(255, 255, 255, 0.06);
      --input-border: rgba(255, 255, 255, 0.15);
      --error-color: #ff4d4d;
      --success-color: #2ed573;
      --radius-lg: 24px;
      --radius-md: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      padding: 40px 20px;
    }

    /* Ambient Background Blobs */
    .ambient-blob {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      filter: blur(130px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.35;
      animation: float-blob 22s infinite alternate;
    }

    .blob-1 {
      background: #0078d4;
      top: -150px;
      left: -100px;
    }

    .blob-2 {
      background: #8e44ad;
      bottom: -150px;
      right: -100px;
      animation-delay: -11s;
    }

    @keyframes float-blob {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 45px) scale(1.2); }
    }

    /* Form Container */
    .register-container {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      width: 100%;
      max-width: 520px;
      padding: 45px 40px;
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      z-index: 10;
      position: relative;
      animation: card-appear 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes card-appear {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .logo-icon {
      font-size: 34px;
      background: linear-gradient(135deg, #8e44ad 0%, #0078d4 100%);
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(142, 68, 173, 0.35);
    }

    .brand-name {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #b0c4de 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .header-desc {
      text-align: center;
      margin-bottom: 30px;
    }

    .header-desc h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 23px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .header-desc p {
      font-size: 13.5px;
      color: var(--text-muted);
    }

    /* Message Alerts */
    .alert {
      padding: 14px 18px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: alert-slide-down 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid transparent;
    }

    .alert-error {
      background: rgba(255, 77, 77, 0.1);
      color: var(--error-color);
      border-color: rgba(255, 77, 77, 0.2);
    }

    .alert-success {
      background: rgba(46, 213, 115, 0.1);
      color: var(--success-color);
      border-color: rgba(46, 213, 115, 0.2);
    }

    .alert-hidden {
      display: none !important;
    }

    @keyframes alert-slide-down {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Form Inputs */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .form-group {
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      padding: 13px 16px 13px 44px;
      font-size: 14.5px;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      transition: var(--transition);
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .form-input:focus {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 17px;
      color: var(--text-muted);
      pointer-events: none;
      transition: var(--transition);
    }

    .form-input:focus + .input-icon {
      color: var(--primary);
    }

    /* Button */
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #8e44ad 0%, #0078d4 100%);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 15px;
      font-size: 15.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(142, 68, 173, 0.25);
      transition: var(--transition);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(142, 68, 173, 0.4);
      background: linear-gradient(135deg, #9b59b6 0%, #0086f0 100%);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    /* Loader Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s infinite linear;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Footer Links */
    .form-footer {
      text-align: center;
      margin-top: 30px;
      font-size: 13.5px;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 20px;
    }

    .login-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
    }

    .login-link:hover {
      color: #00a2ed;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Ambient Blobs -->
  <div class="ambient-blob blob-1"></div>
  <div class="ambient-blob blob-2"></div>

  <!-- Form Card -->
  <div class="register-container">
    <div class="brand-logo">
      <div class="logo-icon">🏢</div>
      <div class="brand-name">eOffice DUT</div>
    </div>

    <div class="header-desc">
      <h1>Đăng ký tài khoản mới</h1>
      <p>Nhập thông tin cá nhân để bắt đầu làm việc trên eOffice</p>
    </div>

    <!-- Alert Messages -->
    <div id="alertBox" class="alert alert-hidden">
      <span id="alertIcon">⚠️</span>
      <span id="alertMessage">Lỗi đăng ký</span>
    </div>

    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-grid">
        <!-- Full Name -->
        <div class="form-group">
          <label for="nameInput" class="form-label">Họ và Tên</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="nameInput" 
              class="form-input" 
              placeholder="Nguyễn Văn A" 
              required 
              autocomplete="name"
            >
            <span class="input-icon">👤</span>
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="emailInput" class="form-label">Email cơ quan</label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="emailInput" 
              class="form-input" 
              placeholder="username@dut.udn.vn" 
              required 
              autocomplete="email"
            >
            <span class="input-icon">✉️</span>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="passwordInput" class="form-label">Mật khẩu</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="passwordInput" 
              class="form-input" 
              placeholder="Tối thiểu 6 ký tự..." 
              required 
              minlength="6"
              autocomplete="new-password"
            >
            <span class="input-icon">🔒</span>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirmPasswordInput" class="form-label">Xác nhận mật khẩu</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="confirmPasswordInput" 
              class="form-input" 
              placeholder="Nhập lại mật khẩu..." 
              required 
              autocomplete="new-password"
            >
            <span class="input-icon">🔄</span>
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="submit-btn">
        <span>TẠO TÀI KHOẢN</span>
        <div id="btnSpinner" class="spinner"></div>
      </button>
    </form>

    <div class="form-footer">
      Bạn đã có tài khoản? <a href="/login.html" class="login-link">Đăng nhập tại đây</a>
    </div>
  </div>

  <script>
    const alertBox = document.getElementById('alertBox');
    const alertMessage = document.getElementById('alertMessage');
    const alertIcon = document.getElementById('alertIcon');
    const submitBtn = document.getElementById('submitBtn');
    const btnSpinner = document.getElementById('btnSpinner');

    function showAlert(type, message) {
      alertBox.className = `alert alert-${type}`;
      alertMessage.textContent = message;
      alertIcon.textContent = type === 'success' ? '✅' : '⚠️';
    }

    function hideAlert() {
      alertBox.classList.add('alert-hidden');
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideAlert();

      const fullName = document.getElementById('nameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const confirmPassword = document.getElementById('confirmPasswordInput').value;

      // Basic front-end checks
      if (password !== confirmPassword) {
        showAlert('error', 'Mật khẩu xác nhận không khớp.');
        return;
      }

      if (password.length < 6) {
        showAlert('error', 'Mật khẩu phải có ít nhất 6 ký tự.');
        return;
      }

      // Visual loading state
      submitBtn.disabled = true;
      btnSpinner.style.display = 'block';

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            fullName,
            email,
            password,
            confirmPassword
          })
        });

        const resData = await response.json();

        if (!response.ok) {
          throw new Error(resData.message || 'Đăng ký thất bại. Email có thể đã được sử dụng.');
        }

        showAlert('success', 'Đăng ký tài khoản thành công! Đang chuyển đến trang đăng nhập...');
        
        // Wait then redirect to login page
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1800);

      } catch (error) {
        console.error('Registration error:', error);
        showAlert('error', error.message);
        submitBtn.disabled = false;
        btnSpinner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
